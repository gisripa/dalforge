# Local Postgres for integration tests and examples.
# Pinned to the community release matching the Aurora PostgreSQL LTS target.
# Start with `mise run db:up`; see mise.toml for the connection URL.
name: dalforge

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: dalforge
      POSTGRES_PASSWORD: dalforge
      POSTGRES_DB: dalforge
    ports:
      - "${DALFORGE_PG_PORT:-55432}:5432"
    # Durability off: this database only holds throwaway test data.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dalforge", "-d", "dalforge"]
      interval: 1s
      timeout: 3s
      retries: 30
