// Lists: one fixed shape per rpc, keyset pagination, and derived indexes.
//
// schema.sql shows the index each list needs and which lists share one
// ("derived for: …"); the queries show the first-page and cursor variants.
// Try: change ListTicketsByQueueAndStatus to order_by ["priority DESC"] and
// see a new index appear, or add a sixth list and watch the index budget
// warning.
syntax = "proto3";

package support.v1;

import "dal/pg/v1/options.proto";
import "dal/v1/options.proto";
import "google/protobuf/timestamp.proto";

message Ticket {
  // An explicit index: lists on assignee_id without an order_by inherit its
  // sort (priority, highest first) and are served by it.
  option (dal.pg.v1.table) = {
    indexes: [{name: "tickets_by_assignee" columns: ["assignee_id", "priority DESC"]}]
  };

  string id = 1 [(dal.v1.field) = {format: FORMAT_UUID primary_key: true}];
  string queue = 2;
  string assignee_id = 3 [(dal.v1.field).format = FORMAT_UUID];
  int32 priority = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6 [(dal.v1.field).role = ROLE_CREATE_TIME];
  optional google.protobuf.Timestamp deleted_at = 7 [(dal.v1.field).role = ROLE_DELETE_TIME];
}

message ByQueue {
  string queue = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ByQueueInWindow {
  string queue = 1;
  google.protobuf.Timestamp created_at_from = 2;
  google.protobuf.Timestamp created_at_to = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ByQueueAndStatus {
  string queue = 1;
  string status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ByAssignee {
  string assignee_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message TicketPage {
  repeated Ticket tickets = 1;
  string next_page_token = 2;
}

service TicketStore {
  option (dal.v1.store) = {entity: "Ticket"};

  // Newest first.
  rpc ListTicketsByQueue(ByQueue) returns (TicketPage) {
    option (dal.v1.query) = {
      list: {
        eq: ["queue"]
        order_by: ["created_at DESC"]
      }
    };
  }
  // A half-open time window; shares the index above, read the other way.
  rpc ListTicketsByQueueAndCreatedAt(ByQueueInWindow) returns (TicketPage) {
    option (dal.v1.query) = {
      list: {
        eq: ["queue"]
        range: "created_at"
      }
    };
  }
  rpc ListTicketsByQueueAndStatus(ByQueueAndStatus) returns (TicketPage) {
    option (dal.v1.query) = {
      list: {
        eq: ["queue", "status"]
        order_by: ["created_at DESC"]
      }
    };
  }
  // No order_by: the sort comes from tickets_by_assignee.
  rpc ListTicketsByAssignee(ByAssignee) returns (TicketPage) {
    option (dal.v1.query) = {
      list: {eq: ["assignee_id"]}
    };
  }
}
