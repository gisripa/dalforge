// Postgres backend options. These refine the physical schema only; the
// entity and its access patterns are declared with dal.v1 and stay
// backend-neutral. Every option here is optional.
//
// Evolution: this file is bundled in the dalforge binary and only grows.
// Type values are never renumbered or removed. Which Postgres version (or
// extension) a type or feature needs is data in the generator, not here, and
// is linted against the deploy target in dalforge.yaml.
//
// See docs/design.md for the type mapping and index derivation.
syntax = "proto3";

package dal.pg.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/gisripa/dalforge/proto/dal/pg/v1;pgv1";

extend google.protobuf.FileOptions {
  File file = 51010;
}

extend google.protobuf.MessageOptions {
  Table table = 51010;
}

extend google.protobuf.FieldOptions {
  Column column = 51010;
}

// File states what the schema in a file needs from Postgres. The deploy
// target itself (e.g. 16.9) lives in dalforge.yaml; lint fails when the target
// is older than min_version or lacks a declared extension.
message File {
  // Minimum Postgres major version, e.g. 16. Zero means dalforge's floor.
  uint32 min_version = 1;

  // Extensions the schema needs, e.g. ["vector"]. Each one is emitted as
  // CREATE EXTENSION IF NOT EXISTS, and every custom_type it provides must be
  // covered by one of them.
  repeated string extensions = 2;
}

// Table refines the Postgres table.
message Table {
  // Explicit indexes. Most indexes are derived from access patterns; declare
  // one here only for partial or covering indexes, or to pin the sort order
  // that List queries without order_by inherit.
  repeated Index indexes = 1;

  // How many indexes (the primary key, unique columns and list indexes) the
  // table may have before DAL201 warns: each one adds write cost. Zero means
  // the default, 5.
  uint32 index_budget = 2;
}

// Index is an explicitly declared index.
message Index {
  // Index name. Defaults to <table>_<col>_<col>_idx.
  string name = 1;

  // Key fields (proto field names) in order, each optionally suffixed with
  // ASC or DESC, e.g.
  // ["account_id", "created_at DESC"].
  repeated string columns = 2;

  // Non-key fields stored in the index (INCLUDE) for index-only scans.
  repeated string include = 3;

  // Predicate for a partial index, as a SQL boolean expression. A list uses
  // a partial index only if this is exactly its own filter
  // (deleted_at IS NULL); otherwise it's for custom queries.
  string where = 4;

  // Makes the index unique. A unique index can back a get.by or an
  // upsert.conflict_on on its columns (DAL104).
  bool unique = 5;
}

// Column refines the Postgres column.
message Column {
  // Physical type. When unset it is inferred from the proto type and the
  // dal.v1 format (see Types in the manual).
  oneof pg_type {
    // A first-class Postgres type. Only types that fit the field's proto type
    // are allowed (DAL209), since the Go type follows the proto type.
    Type type = 1;
    // Raw type for anything Type doesn't cover (extension types such as
    // vector(1536), or parameterised types such as numeric(12,2)).
    string custom_type = 2;
  }

  // Column default as a SQL expression, e.g. "now()" or "'pending'".
  string default = 3;

  // Go type for a custom_type column, as "import/path.Type", e.g.
  // "github.com/pgvector/pgvector-go.Vector". It's passed to sqlc as a type
  // override and becomes the model field's type. Required with custom_type.
  string go_type = 4;
}

// Type lists Postgres types with first-class support: the generator knows
// their Go type, pgx codec, sqlc override and keyset encoding. Values are only
// ever added. A value whose type needs a newer Postgres than the floor notes
// it, e.g. "// PG 17+". All values below exist in every supported version.
enum Type {
  TYPE_UNSPECIFIED = 0;
  TYPE_TEXT = 1;
  TYPE_UUID = 2;
  TYPE_BOOLEAN = 3;
  TYPE_SMALLINT = 4;
  TYPE_INTEGER = 5;
  TYPE_BIGINT = 6;
  TYPE_REAL = 7;
  TYPE_DOUBLE_PRECISION = 8;
  TYPE_NUMERIC = 9;
  TYPE_TIMESTAMPTZ = 10;
  TYPE_DATE = 11;
  TYPE_JSONB = 12;
  TYPE_BYTEA = 13;
  TYPE_INET = 14;
}
